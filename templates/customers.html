{% extends "base.html" %}

{% block title %}
Customers - Inventory Management System
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>Customers</h2>

        <p class="text-muted mb-0">
            Manage your customers
        </p>

    </div>


    <!-- Add Customer -->

    <button
        id="addCustomerButton"
        type="button"
        class="btn btn-dark"
        data-bs-toggle="modal"
        data-bs-target="#customerModal"
        onclick="openAddCustomerModal()">

        Add Customer

    </button>

</div>


<!-- Message -->

<div
    id="message"
    class="alert d-none">
</div>


<!-- Customers Table -->

<div class="card shadow-sm">

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="customersTableBody">

                    <tr>

                        <td
                            colspan="6"
                            class="text-center">

                            Loading customers...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ========================================== -->
<!-- Customer Modal -->
<!-- ========================================== -->

<div
    class="modal fade"
    id="customerModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">


            <!-- Header -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="customerModalTitle">

                    Add Customer

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- Body -->

            <div class="modal-body">

                <form id="customerForm">

                    <input
                        type="hidden"
                        id="customerId">


                    <!-- Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            class="form-control"
                            required>

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="customerEmail"
                            class="form-control">

                    </div>


                    <!-- Phone -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            id="customerPhone"
                            class="form-control">

                    </div>


                    <!-- Address -->

                    <div class="mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            id="customerAddress"
                            class="form-control"
                            rows="3">
                        </textarea>

                    </div>

                </form>

            </div>


            <!-- Footer -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-dark"
                    onclick="saveCustomer()">

                    Save Customer

                </button>

            </div>


        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for('static', filename='js/customers.js') }}">
</script>

{% endblock %}
