{% extends "base.html" %}

{% block title %}
Suppliers - Inventory Management System
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>Suppliers</h2>

        <p class="text-muted mb-0">
            Manage your suppliers
        </p>

    </div>


    <!-- Add Supplier Button -->

    <button
        id="addSupplierButton"
        type="button"
        class="btn btn-dark"
        data-bs-toggle="modal"
        data-bs-target="#supplierModal"
        onclick="openAddSupplierModal()">

        Add Supplier

    </button>

</div>


<!-- Message -->

<div
    id="message"
    class="alert d-none">
</div>


<!-- Suppliers Table -->

<div class="card shadow-sm">

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Company</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="suppliersTableBody">

                    <tr>

                        <td
                            colspan="7"
                            class="text-center">

                            Loading suppliers...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ========================================== -->
<!-- Supplier Modal -->
<!-- ========================================== -->

<div
    class="modal fade"
    id="supplierModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">


            <!-- Modal Header -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="supplierModalTitle">

                    Add Supplier

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- Modal Body -->

            <div class="modal-body">

                <form id="supplierForm">


                    <input
                        type="hidden"
                        id="supplierId">


                    <!-- Name -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Name

                        </label>


                        <input
                            type="text"
                            id="supplierName"
                            class="form-control"
                            required>

                    </div>


                    <!-- Company -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Company Name

                        </label>


                        <input
                            type="text"
                            id="supplierCompany"
                            class="form-control">

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Email

                        </label>


                        <input
                            type="email"
                            id="supplierEmail"
                            class="form-control">

                    </div>


                    <!-- Phone -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Phone

                        </label>


                        <input
                            type="text"
                            id="supplierPhone"
                            class="form-control">

                    </div>


                    <!-- Address -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Address

                        </label>


                        <textarea
                            id="supplierAddress"
                            class="form-control"
                            rows="3">
                        </textarea>

                    </div>


                </form>

            </div>


            <!-- Modal Footer -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-dark"
                    onclick="saveSupplier()">

                    Save Supplier

                </button>

            </div>


        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for('static', filename='js/suppliers.js') }}">
</script>

{% endblock %}
