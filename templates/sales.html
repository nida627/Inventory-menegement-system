{% extends "base.html" %}

{% block title %}
Sales - Inventory Management System
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>Sales</h2>

        <p class="text-muted mb-0">
            Manage product sales
        </p>

    </div>


    <button
        id="addSaleButton"
        type="button"
        class="btn btn-dark"
        data-bs-toggle="modal"
        data-bs-target="#saleModal"
        onclick="openAddSaleModal()">

        Add Sale

    </button>

</div>


<div id="message" class="alert d-none"></div>


<!-- Sales Table -->

<div class="card shadow-sm">

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Customer</th>
                        <th>Date</th>
                        <th>Total Amount</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="salesTableBody">

                    <tr>

                        <td
                            colspan="6"
                            class="text-center">

                            Loading sales...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ========================================== -->
<!-- Sale Modal -->
<!-- ========================================== -->

<div
    class="modal fade"
    id="saleModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <!-- Header -->

            <div class="modal-header">

                <h5 class="modal-title">

                    Create Sale

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- Body -->

            <div class="modal-body">


                <!-- Customer -->

                <div class="mb-4">

                    <label class="form-label">

                        Customer

                    </label>


                    <select
                        id="saleCustomer"
                        class="form-select"
                        required>

                        <option value="">

                            Select Customer

                        </option>

                    </select>

                </div>


                <!-- Sale Items -->

                <div
                    class="d-flex justify-content-between align-items-center mb-2">

                    <h6 class="mb-0">

                        Sale Items

                    </h6>


                    <button
                        type="button"
                        class="btn btn-sm btn-outline-dark"
                        onclick="addSaleItem()">

                        + Add Item

                    </button>

                </div>


                <div id="saleItems">

                </div>


                <!-- Total -->

                <div class="text-end mt-4">

                    <h5>

                        Total:
                        ₹<span id="saleTotal">0.00</span>

                    </h5>

                </div>

            </div>


            <!-- Footer -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-dark"
                    onclick="saveSale()">

                    Create Sale

                </button>

            </div>


        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for('static', filename='js/sales.js') }}">
</script>

{% endblock %}
