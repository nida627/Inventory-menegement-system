<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Inventory Management System
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <!-- ==================== NAVBAR ==================== -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <a
                class="navbar-brand"
                href="/dashboard"
            >
                Inventory Management System
            </a>

            <div class="d-flex align-items-center">

                <span
                    class="text-white me-3"
                    id="userName"
                >
                    User
                </span>

                <span
                    class="badge bg-secondary me-3"
                    id="userRole"
                >
                    Role
                </span>

            </div>

        </div>

    </nav>


    <!-- ==================== MAIN LAYOUT ==================== -->

    <div class="container-fluid">

        <div class="row">


            <!-- ==================== SIDEBAR ==================== -->

            <div class="col-md-2 bg-light min-vh-100 p-3">

                <h5 class="mb-4">
                    Menu
                </h5>


                <div class="list-group">


                    <!-- Dashboard -->

                    <a
                        href="/dashboard"
                        class="list-group-item list-group-item-action"
                    >
                        Dashboard
                    </a>


                    <!-- Products -->

                    <a
                        href="/products"
                        class="list-group-item list-group-item-action"
                    >
                        Products
                    </a>


                    <!-- Categories -->

                    <a
                        href="/categories"
                        class="list-group-item list-group-item-action"
                    >
                        Categories
                    </a>


                    <!-- Suppliers -->

                    <a
                        href="/suppliers"
                        class="list-group-item list-group-item-action"
                    >
                        Suppliers
                    </a>


                    <!-- Customers -->

                    <a
                        href="/customers"
                        class="list-group-item list-group-item-action"
                    >
                        Customers
                    </a>


                    <!-- Purchases -->

                    <a
                        href="/purchases"
                        class="list-group-item list-group-item-action"
                    >
                        Purchases
                    </a>


                    <!-- Sales -->

                    <a
                        href="/sales"
                        class="list-group-item list-group-item-action"
                    >
                        Sales
                    </a>


                    <!-- Inventory -->

                    <a
                        href="/inventory"
                        class="list-group-item list-group-item-action"
                    >
                        Inventory
                    </a>


                    <!-- Reports -->

                    <a
                        href="/reports"
                        class="list-group-item list-group-item-action"
                    >
                        Reports
                    </a>


                    <!-- Logout -->

                    <button
                        class="list-group-item list-group-item-action text-danger"
                        onclick="logout()"
                    >
                        Logout
                    </button>

                </div>

            </div>


            <!-- ==================== MAIN CONTENT ==================== -->

            <div class="col-md-10 p-4">

                {% block content %}

                {% endblock %}

            </div>

        </div>

    </div>


    <!-- ==================== BOOTSTRAP JS ==================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- ==================== COMMON JS ==================== -->

    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>


    <!-- ==================== PAGE-SPECIFIC JS ==================== -->

    {% block scripts %}

    {% endblock %}

</body>

</html>
