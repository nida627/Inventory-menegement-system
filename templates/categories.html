{% extends "base.html" %}

{% block title %}
Categories - Inventory Management System
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>Categories</h2>

        <p class="text-muted mb-0">
            Manage product categories
        </p>

    </div>


    <!-- Add Category Button -->

    <button
        id="addCategoryButton"
        type="button"
        class="btn btn-dark"
        data-bs-toggle="modal"
        data-bs-target="#categoryModal"
        onclick="openAddCategoryModal()">

        Add Category

    </button>

</div>


<!-- Message -->

<div
    id="message"
    class="alert d-none">
</div>


<!-- Categories Table -->

<div class="card shadow-sm">

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Created At</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="categoriesTableBody">

                    <tr>

                        <td
                            colspan="5"
                            class="text-center">

                            Loading categories...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ========================================== -->
<!-- Add / Edit Category Modal -->
<!-- ========================================== -->

<div
    class="modal fade"
    id="categoryModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">


            <!-- Modal Header -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="categoryModalTitle">

                    Add Category

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- Modal Body -->

            <div class="modal-body">

                <form id="categoryForm">


                    <input
                        type="hidden"
                        id="categoryId">


                    <!-- Category Name -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Category Name

                        </label>


                        <input
                            type="text"
                            id="categoryName"
                            class="form-control"
                            required>

                    </div>


                    <!-- Description -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Description

                        </label>


                        <textarea
                            id="categoryDescription"
                            class="form-control"
                            rows="3">
                        </textarea>

                    </div>


                </form>

            </div>


            <!-- Modal Footer -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-dark"
                    onclick="saveCategory()">

                    Save Category

                </button>

            </div>


        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for('static', filename='js/categories.js') }}">
</script>

{% endblock %}
